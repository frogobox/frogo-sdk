unityAd = "4.20.0" # https://developers.google.com/admob/android/mediation/unity#step_3_import_the_unity_ads_sdk_and_adapter

# Other Third-Party Libraries
customactivityoncrash = "2.4.0"
circleimageview = "3.1.0"

# Testing
junit = "4.13.2"
mockk = "1.14.11"
robolectric = "4.16.1"

