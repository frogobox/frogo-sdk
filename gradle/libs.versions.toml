viewPager2 = "1.1.0"
preference = "1.2.1"
recyclerview = "1.4.0"
work = "2.11.2"
roomKtx = "2.8.4"

# AndroidX Compose
composeBom = "2026.08.00"
navigationCompose = "2.10.0"

# AndroidX Testing
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
espressoCore = "3.7.0"

# Google
googleAdmob = "1.4.0" # https://developers.google.com/admob/android/quick-start
material = "1.14.0"
gson = "2.14.0"
flexbox = "3.0.0"

# KotlinX
kotlinxCoroutinesCore = "1.11.0"
